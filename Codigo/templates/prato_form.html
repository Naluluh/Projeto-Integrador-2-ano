{% extends "base.html" %}

{% block titulo %}
Novo Prato
{% endblock %}

{% block conteudo %}
<form id="formPrato" action="{{ url_for('prato.novo') }}" method="POST">
    <label for="nome">Nome do Prato:</label>
    <input type="text" id="nome" name="nome" required>

    <label for="descricao">Descrição:</label>
    <input type="text" id="descricao" name="descricao" required>

    <label for="preco">Preço:</label>
    <input type="number" id="preco" name="preco" step="0.01" required>

    <label for="modo_preparo">Modo de preparo:</label>
    <input type="text" id="modo_preparo" name="modo_preparo" required>

    <label for="categoria_select">Categoria:</label>

    <select id="categoria_select" name="categoria"
            onchange="verificarCategoria(this.value)" required>
        <option value="">Selecione uma categoria...</option>

        {% for cat in categorias %}
            <option value="{{ cat.id }}">{{ cat.nome }}</option>
        {% endfor %}

    <option value="__nova__">+ Criar nova categoria...</option>
    </select>



<!-- Campo dinâmico para nova categoria -->
<div id="boxNovaCategoria" style="display: none; margin-top: 10px;">
    <input type="text" id="nomeNovaCategoria" name="nova_categoria" placeholder="Nome da nova categoria">
    <button type="button" onclick="cadastrarCategoriaAsync()">Salvar Categoria</button>
</div>

    <!-- Seleção dos Chefs que fazem este prato -->
    <label for="chefs">Chefs Responsáveis:</label>
    <select id="chefs" name="chefs_ids" multiple required>
        <!-- Preenchido dinamicamente com os cozinheiros do banco -->
        {% for chef in cozinheiros %}
            <option value="{{ chef.id }}">{{ chef.nome }}</option>
        {% endfor %}
    </select>

    <button type="submit">Cadastrar Prato</button>
</form>
{% endblock %}
