{% extends "base.html" %}

{% block titulo %}
Cadastrar usuário
{% endblock %}

{% block conteudo %}

<section class="auth-card">

    <h1>Cadastrar funcionário</h1>

    <form
        method="post"
        class="formulario"
    >

        <label>
            Nome completo

            <input
                name="nome"
                required
                minlength="2"
            >
        </label>

        <label>
            Usuário

            <input
                name="usuario"
                required
                minlength="3"
                autocomplete="username"
            >
        </label>

        <label>
            Senha

            <input
                type="password"
                name="senha"
                required
                minlength="6"
                autocomplete="new-password"
            >
        </label>

        <label>
            Cargo

            <select
                name="cargo"
                required
            >
                <option value="">
                    Selecione...
                </option>

                <option value="cliente">
                    Cliente
                </option>

                <option value="cozinheiro">
                    Cozinheiro
                </option>
            </select>

        </label>

        <button
            class="botao primario"
            type="submit"
        >
            Cadastrar usuário
        </button>

    </form>

    <p>
        <a href="{{ url_for('auth.login') }}">
            Voltar ao login
        </a>
    </p>

</section>

{% endblock %}
