{%extends "base.html" %}
{% block titulo %}
Categóricos
{% endblock %}

{% block conteudo %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha de Categorias</title>
</head>
<body>
    <form method="post">
        {%for u in categorias%}
            <section class="auth-card">
                <a href="{{url_for('categorias.exibir', categoria=u['id'])}}"><img src="https://cdn.pixabay.com/photo/2016/11/18/14/39/beans-1834984_1280.jpg" style="width: 20px; height: 20px"></a>
                <h2>{{u['nome']}}</h2>
            </section>
        {%endfor%}
    </form>
    {% endblock %}
</body>
</html>
