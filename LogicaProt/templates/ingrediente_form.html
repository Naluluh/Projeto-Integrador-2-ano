{% extends "base.html" %}

{% block titulo %}
{{ 'Editar' if ingrediente else 'Novo' }} ingrediente
{% endblock %}

{% block conteudo %}

<div class="cabecalho-pagina">

    <div>

        <h1>
            {{ 'Editar' if ingrediente else 'Novo' }} ingrediente
        </h1>

        <p>
            Cadastre o ingrediente e sua quantidade disponível.
        </p>

    </div>

</div>


<form
    method="post"
    class="painel formulario grade-form"
>

    <label>
        Nome *

        <input
            name="nome"
            required
            value="{{
                ingrediente.nome
                if ingrediente
                else request.form.get('nome', '')
            }}"
        >
    </label>


    <label>
        Unidade *

        <select
            name="unidade"
            required
        >

            {% set atual =
                ingrediente.unidade
                if ingrediente
                else request.form.get('unidade', '')
            %}

            {% for u in [
                'unidade',
                'kg',
                'g',
                'litro',
                'ml'
            ] %}

                <option
                    value="{{ u }}"
                    {{ 'selected' if atual == u }}
                >
                    {{ u }}
                </option>

            {% endfor %}

        </select>

    </label>


    <label>
        Estoque *

        <input
            type="number"
            name="estoque"
            min="0"
            step="0.01"
            required
            value="{{
                ingrediente.estoque
                if ingrediente
                else request.form.get('estoque', 0)
            }}"
        >
    </label>


    <div class="form-acoes">

        <a
            class="botao secundario"
            href="{{ url_for('ingrediente.listar') }}"
        >
            Cancelar
        </a>

        <button class="botao primario">
            Salvar ingrediente
        </button>

    </div>

</form>

{% endblock %}
