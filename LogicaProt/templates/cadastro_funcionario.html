{% extends "base.html" %}

{% block titulo %}
Cadastrar funcionário
{% endblock %}

{% block conteudo %}

<section class="auth-card">

    <h1>Cadastrar funcionário</h1>

    <form
        method="post"
        class="formulario"
    >

        <label>
            Nome completo

            <input
                name="nome"
                required
                minlength="2"
            >
        </label>

        <label>
            Usuário

            <input
                name="usuario"
                required
                minlength="3"
                autocomplete="username"
            >
        </label>

        <label>
            Senha

            <input
                type="password"
                name="senha"
                required
                minlength="6"
                autocomplete="new-password"
            >
        </label>

        <label>
            Cargo

            <select
                name="cargo"
                required
            >
                <option value="">
                    Selecione...
                </option>

                <option value="garcom">
                    Garçom
                </option>

                <option value="cozinheiro">
                    Cozinheiro
                </option>

                <option value="caixa">
                    Caixa
                </option>

                <option value="gerente">
                    Gerente
                </option>

                <option value="administrador">
                    Administrador
                </option>

            </select>

        </label>

        <button
            class="botao primario"
            type="submit"
        >
            Cadastrar funcionário
        </button>

    </form>

    <p>
        <a href="{{ url_for('auth.login') }}">
            Voltar ao login
        </a>
    </p>

</section>

{% endblock %}
