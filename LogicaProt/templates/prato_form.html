{% extends "base.html" %}

{% block titulo %}
{{ 'Editar' if prato else 'Novo' }} prato
{% endblock %}

{% block conteudo %}

<div class="cabecalho-pagina">

    <div>

        <h1>
            {{ 'Editar' if prato else 'Novo' }} prato
        </h1>

        <p>
            Os campos com * são obrigatórios.
        </p>

    </div>

</div>


<form
    method="post"
    class="painel formulario grade-form"
>

    <label>
        Nome *

        <input
            name="nome"
            required
            value="{{
                prato.nome
                if prato
                else request.form.get('nome', '')
            }}"
        >
    </label>


    <label>
        Categoria *

        <input
            name="categoria"
            required
            placeholder="Ex.: Massas, Carnes, Sobremesas"
            value="{{
                prato.categoria
                if prato
                else request.form.get('categoria', '')
            }}"
        >
    </label>


    <label>
        Preço (R$) *

        <input
            name="preco"
            inputmode="decimal"
            required
            placeholder="29,90"
            value="{{
                ('%.2f'|format(
                    prato.preco_centavos / 100
                ))
                if prato
                else request.form.get('preco', '')
            }}"
        >
    </label>


    <label>
        Descrição *

        <textarea
            name="descricao"
            required
            rows="4"
        >{{
            prato.descricao
            if prato
            else request.form.get('descricao', '')
        }}</textarea>

    </label>


    <label>
        Modo de preparo *

        <textarea
            name="modo_preparo"
            required
            rows="7"
            placeholder="Descreva como o prato deve ser preparado."
        >{{
            prato.modo_preparo
            if prato
            else request.form.get('modo_preparo', '')
        }}</textarea>

    </label>


    <div class="form-acoes">

        <a
            class="botao secundario"
            href="{{ url_for('prato.listar') }}"
        >
            Cancelar
        </a>

        <button class="botao primario">
            Salvar prato
        </button>

    </div>

</form>

{% endblock %}
