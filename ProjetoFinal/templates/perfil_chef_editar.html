{% extends "base.html" %}

{% block titulo %}
Editar perfil · Sabor & Clic
{% endblock %}

{% block conteudo %}

<section class="auth-card">

    <h1>Editar perfil</h1>

    <form method="post" class="formulario">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="formacao">Formação</label>
        <input type="text" id="formacao" name="formacao" value="{{ perfil.formacao or '' }}">

        <label for="biografia">Biografia</label>
        <textarea id="biografia" name="biografia" rows="5" required>{{ perfil.biografia }}</textarea>

        <label for="experiencia">Experiência</label>
        <input type="text" id="experiencia" name="experiencia" value="{{ perfil.experiencia or '' }}">

        <button class="botao primario" type="submit">Salvar</button>

    </form>

    <p>
        <a href="{{ url_for('chefs.perfil', chef_id=session.get('usuario_id')) }}">Voltar</a>
    </p>

</section>

{% endblock %}
