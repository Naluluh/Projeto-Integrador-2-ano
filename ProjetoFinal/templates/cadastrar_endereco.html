
{% extends "base.html" %}
{% block titulo %}
Cadastrar endereço
{% endblock %}

{% block conteudo %}

<section class="auth-card">

    <h1>Cadastrar endereço</h1>

    <p>
        Informe seu CEP para preencher automaticamente
        os dados do endereço.
    </p>

    <form
        method="post"
        class="formulario formulario--linhas"
    >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- CEP -->

        <label for="cep">
            CEP
        </label>

        <input
            type="text"
            id="cep"
            name="cep"
            maxlength="9"
            placeholder="00000-000"
            autocomplete="postal-code"
            required
        >

        <!-- Logradouro -->

        <label for="logradouro">
            Logradouro
        </label>

        <input
            type="text"
            id="logradouro"
            name="logradouro"
            autocomplete="street-address"
            required
        >

        <!-- Número -->

        <label for="numero">
            Número
        </label>

        <input
            type="text"
            id="numero"
            name="numero"
            required
        >

        <!-- Complemento -->

        <label for="complemento">
            Complemento
        </label>

        <input
            type="text"
            id="complemento"
            name="complemento"
            placeholder="Apartamento, bloco, casa..."
        >

        <!-- Bairro -->

        <label for="bairro">
            Bairro
        </label>

        <input
            type="text"
            id="bairro"
            name="bairro"
            autocomplete="address-level3"
            required
        >

        <!-- Cidade -->

        <label for="cidade">
            Cidade
        </label>

        <input
            type="text"
            id="cidade"
            name="cidade"
            autocomplete="address-level2"
            required
        >

        <!-- Estado -->

        <label for="estado">
            Estado
        </label>

        <input
            type="text"
            id="estado"
            name="estado"
            maxlength="2"
            placeholder="SP"
            autocomplete="address-level1"
            required
        >

        <!-- País -->

        <label for="pais">
            País
        </label>

        <input
            type="text"
            id="pais"
            name="pais"
            value="Brasil"
            autocomplete="country-name"
            required
        >

        <!-- Botão -->

        <button
            class="botao primario"
            type="submit"
        >
            Cadastrar endereço
        </button>

    </form>

</section>

<script
    src="{{ url_for('static', filename='js/cep.js') }}"
></script>

{% endblock %}
